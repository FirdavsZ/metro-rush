services:
  - type: web
    name: metro-rush-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: metro-rush-db
          property: connectionString
      - key: CLIENT_URL
        sync: false   # fill in manually after Vercel deploy

databases:
  - name: metro-rush-db
    databaseName: metro_rush
    plan: free
