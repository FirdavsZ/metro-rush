services:
  - type: web
    name: metro-rush-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste from Neon: postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
      - key: CLIENT_URL
        value: https://metro-rush-alpha.vercel.app
